syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/kalandramo/lulu-bootstrap/conf/gen/go/bootstrap/v1";

// Logger 描述日志系统配置。
message Logger {
  enum Type {
    TYPE_UNSPECIFIED = 0;

    SLOG = 1;
  }

  // Slog（Go 标准库）日志配置。
  message Slog {
    string level = 1;
    string format = 2;
    string output_path = 3;
  }

  string type = 1;

  // 本地日志库。
  optional Slog slog = 2;
}
